name: ci
# No npm install: the repo has no dependencies. Node 22 runs the tests; Python is only for the conversion helpers.
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LANG: C.UTF-8
      # Shabbat-safe mode is tested by faking the clock in local time; a zone with summer time keeps those tests honest.
      TZ: America/Toronto
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: Unit tests (packages from src/, and the repo's own scripts)
        run: npm test
      - name: Unit tests again, against the built dist/
        run: node --test "packages/*/tests/*.test.js"
        env: { ALEF_TEST_DIST: '1' }
      - name: Manifest schema and rules
        run: node scripts/check-manifest.mjs
      - name: Size budgets (packs, first install, no weights in git)
        run: node scripts/check-budgets.mjs
      - name: dist/ is what src/ builds
        run: node scripts/build-dist.mjs --check
      - name: docs/LICENCES.md is current
        run: node scripts/build-licences.mjs --check
      - name: No model weights are tracked by git
        run: |
          bad=$(git ls-files | grep -Ei '\.(onnx|onnx_data|safetensors|pt|gguf|tflite|bin|part)$' | grep -v '/tests/fixtures/' || true)
          if [ -n "$bad" ]; then echo "weights in git:"; echo "$bad"; exit 1; fi
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - name: Lint and test tools (pinned), plus onnx for the metadata test
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-ci.txt "$(grep '^onnx==' scripts/requirements.txt)"
      - name: Lint
        run: python -m ruff check scripts packages
      - name: Tests
        run: python -m pytest -q scripts/tests_py
