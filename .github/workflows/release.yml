name: release
# A tag vX.Y.Z builds every dist/, runs the checks, and publishes a GitHub release with:
#   alef-tools-<tag>-dist.tar.gz   every package's dist/ (what the app vendors)
#   release-manifest.json          the tag, the commit, every dist file with its SHA-256, and the pack parts attached
#   models.manifest.json           as of this tag
#   <pack>--<part>                 language pack parts, when ./out/packs/ holds any (see README: packs are converted offline,
#                                  never in this workflow, and can also be added afterwards with `gh release upload`)
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TZ: America/Toronto
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: npm test
      - run: node scripts/check-manifest.mjs
      - run: node scripts/check-budgets.mjs
      - run: node scripts/build-dist.mjs --check
      - name: Build the release folder
        run: node scripts/release.mjs --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA"
      - name: Archive every dist/
        run: tar -czf "release-out/alef-tools-$GITHUB_REF_NAME-dist.tar.gz" --owner=0 --group=0 --numeric-owner --mtime='2026-01-01 00:00Z' -T release-out/dist-files.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag \
            "release-out/alef-tools-$GITHUB_REF_NAME-dist.tar.gz" release-out/release-manifest.json release-out/models.manifest.json release-out/packs/*
